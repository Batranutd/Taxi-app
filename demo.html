<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<title>Taxi · Prezentare</title>
<link rel="stylesheet" href="css/base.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #1B1E24; }
  .stage { position: fixed; inset: 0; display: flex; gap: 18px; padding: 16px; align-items: stretch; }
  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
  .label { color: #C9CDD4; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .label .d { width: 10px; height: 10px; border-radius: 50%; }
  .phone { position: relative; overflow: hidden; border-radius: 44px; background: #0B0C0F; padding: 12px; box-shadow: 0 0 0 2px #2C3038, 0 30px 60px rgba(0,0,0,.45); flex: none; }
  .phone .screen { width: 390px; height: 844px; border-radius: 32px; overflow: hidden; transform-origin: top left; background: #fff; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .desk { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .desk .frame { flex: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 2px #2C3038, 0 30px 60px rgba(0,0,0,.45); background: #fff; }
  .desk iframe { width: 100%; height: 100%; border: 0; display: block; }
  .back { position: fixed; left: 16px; bottom: 12px; color: #9AA0AA; font-weight: 700; font-size: 13px; text-decoration: none; z-index: 5; }
  .small-warn { display: none; color: #fff; padding: 40px 24px; text-align: center; }
  @media (max-width: 1100px) { .stage { display: none; } .small-warn { display: block; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phone-col"><div class="label"><span class="d" style="background:var(--accent)"></span>Client</div><div class="phone" id="p1"><div class="screen"><iframe src="client.html" title="Aplicația client" allow="geolocation; clipboard-write"></iframe></div></div></div>
  <div class="phone-col"><div class="label"><span class="d" style="background:var(--free)"></span>Șofer</div><div class="phone" id="p2"><div class="screen"><iframe src="sofer.html" title="Aplicația șofer" allow="geolocation; autoplay"></iframe></div></div></div>
  <div class="desk"><div class="label"><span class="d" style="background:#fff"></span>Dispecerat</div><div class="frame"><iframe src="dispecer.html" title="Dispecerat"></iframe></div></div>
</div>
<div class="small-warn"><h2>Prezentarea are nevoie de un ecran lat</h2><p>Deschide pagina pe un laptop sau un monitor. Pe telefon, folosește aplicațiile separat.</p><p><a class="btn primary" href="index.html">Înapoi</a></p></div>
<a class="back" href="index.html">← Înapoi</a>
<script>
  // micșorează telefoanele ca să încapă pe înălțimea ecranului
  function fit() {
    const h = innerHeight - 16 * 2 - 28;
    const s = Math.min(1, (h - 24) / 844);
    for (const id of ['p1', 'p2']) {
      const ph = document.getElementById(id), sc = ph.querySelector('.screen');
      sc.style.transform = `scale(${s})`;
      ph.style.width = (390 * s + 24) + 'px';
      ph.style.height = (844 * s + 24) + 'px';
      ph.style.borderRadius = (44 * s) + 'px';
    }
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
